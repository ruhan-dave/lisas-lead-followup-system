name: Warmup Emails

on:
  schedule:
    # 9am, 12pm, 3pm, 6pm UTC — 4 batches/day, 3 emails per sender per batch
    - cron: '0 9,12,15,18 * * *'
  workflow_dispatch:

jobs:
  warmup:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run warmup sender
        env:
          AIRTABLE_API_KEY: ${{ secrets.AIRTABLE_API_KEY }}
          AIRTABLE_BASE_ID: ${{ secrets.AIRTABLE_BASE_ID }}
          SMTP_USER1: ${{ secrets.SMTP_USER1 }}
          SMTP_USER2: ${{ secrets.SMTP_USER2 }}
          SMTP_USER3: ${{ secrets.SMTP_USER3 }}
          SMTP_USERS: ${{ secrets.SMTP_USERS }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          EMAIL_FROM_NAME: ${{ secrets.EMAIL_FROM_NAME }}
          EMAIL_FROM_ADDRESS: ${{ secrets.EMAIL_FROM_ADDRESS }}
          EMAIL_MIN_DELAY_SECONDS: ${{ secrets.EMAIL_MIN_DELAY_SECONDS }}
          LOG_LEVEL: ${{ secrets.LOG_LEVEL }}
        run: |
          python scripts/warmup_sender.py
